[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probix-autonomous-taxi"
version = "0.1.0"
description = "Simulation-first campus taxi: Python laptop, ESP32-CAM and Arduino"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
vision = ["opencv-python>=4.10,<5", "numpy>=1.26,<3"]

[tool.setuptools.package-data]
taxi = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["taxi*"]
